name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest commit needs to reach Pages, so a push supersedes any deploy
# still in flight. This is the same pattern the dashboard exists to encourage.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu only. Deploying the dashboard must never consume a macOS slot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same command CI runs and the README gives contributors, so the three
      # cannot drift apart. Kept here as well as on pull requests because
      # workflow_dispatch reaches this job without going through one.
      - run: npm run verify

      # enablement turns Pages on for a fresh repository rather than failing.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
