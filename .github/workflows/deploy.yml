name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest commit needs to reach Pages, so a push supersedes any deploy
# still in flight. This is the same pattern the dashboard exists to encourage.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu only. Deploying the dashboard must never consume a macOS slot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Content Security Policy in the build output
        run: npm run check:csp

      - name: Verify no network calls outside the API client
        run: npm run check:fetch

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
