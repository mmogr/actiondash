name: CI

# Never add paths: or branches: to this trigger. A required check whose
# workflow does not run never reports, and the pull request then waits on a
# status that will never arrive, with nobody else able to unstick it. Filter
# at the step level with if:, where a skipped step still reports success.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Deliberately NOT the 'pages' group deploy.yml uses: that group is
# workflow-wide rather than per-ref, so sharing it would let a push to one
# pull request cancel a deploy already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Ubuntu only. Verifying the dashboard must never consume a macOS slot.
    runs-on: ubuntu-latest
    # A hung browser must not hold a runner for the default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser tests drive the built page in headless Chromium. Only the
      # headless shell: nothing here opens a window, and it is the smaller
      # download. Not cached: restoring takes about as long as downloading, and
      # a cache could hold a browser this version of Playwright no longer pins.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Starts with the check for skipped, focused or retried tests, which
      # defends the others.
      - run: npm run verify

      # A failing browser test is diagnosed from its trace and screenshot,
      # never by re-running it until it passes. The only tokens in them are
      # the tests' own sentinels.
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
